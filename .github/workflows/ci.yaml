name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Build the distribution
        run: make build
      - name: Validate example configs
        run: make validate
      - name: Check dependency licenses
        run: make licenses 2> licenses.err || { grep -E 'Not allowed|unknown|Failed' licenses.err | sed -E 's#(library [^/]+/[^/]+/[^/ ]+)[^ ]*#\1#' | sort -u | head -9 | sed 's/^/::error::/'; exit 1; }
      - name: Check known vulnerabilities
        run: make vuln
      - name: Check no module depends on the AGPL collector fork
        run: make forbid-fork

  # Each platform on its own native runner: both binaries run, as the image's
  # non-root user, and report the version the image was built with.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: |
          version=0.1.0-ci+$(git rev-parse --short=12 HEAD)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build --build-arg VERSION="$version" -t fusescope-collector:ci .
      - name: Test both binaries in the image
        run: scripts/test-image.sh fusescope-collector:ci "$VERSION" ${{ matrix.arch }}

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Check generated metadata is current
        run: make components-gen && git diff --exit-code
      - name: Test components
        run: set -o pipefail; make components 2>&1 | tee components.out || { grep -E '\.go:[0-9]+|^(FAIL|---|panic)|got |want ' components.out | head -9 | sed 's/^/::error::/'; exit 1; }

  # fusescope-schema against a real 2x2 ClickHouse cluster, with each
  # coordination service the spec supports, one node and a 3-node ensemble
  # (docs/spec/fusescope-schema.md §9).
  schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coordination: [keeper, zookeeper]
        ensemble: [1, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Integration tests (${{ matrix.coordination }}, ${{ matrix.ensemble }} node(s))
        run: make schema-integration COORDINATION=${{ matrix.coordination }} ENSEMBLE=${{ matrix.ensemble }}
