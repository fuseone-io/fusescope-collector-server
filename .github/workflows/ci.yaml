name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Build the distribution
        run: make build
      - name: Validate example configs
        run: make validate
      - name: Check dependency licenses
        run: make licenses
      - name: Check known vulnerabilities
        run: make vuln

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t fusescope-collector:ci .
