name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Build the distribution
        run: make build
      - name: Validate example configs
        run: make validate
      - name: Check dependency licenses
        run: make licenses 2> licenses.err || { grep -v -E '^W[0-9]' licenses.err | tail -9 | sed 's/^/::error::/'; exit 1; }
      - name: Check known vulnerabilities
        run: make vuln

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t fusescope-collector:ci .

  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Check generated metadata is current
        run: make components-gen && git diff --exit-code
      - name: Test components
        run: make components
