name: release

# Publishes the container image to GHCR for linux/amd64 and linux/arm64, with
# provenance and an SBOM, only for commits whose ci run succeeded: each commit
# on main as :sha-<commit>, then :main at main's head; each vX.Y.Z tag as
# :X.Y.Z, :X.Y and :latest.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fusescope-collector

jobs:
  # No concurrency group: each commit gets its own image, none is cancelled.
  image:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require ci to have passed on a tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --commit "$(git rev-parse HEAD)" --status success --json databaseId --jq length)
          [ "$ok" -gt 0 ] || { echo "::error::ci has not passed on $(git rev-parse HEAD)"; exit 1; }
      - name: Tags and version
        id: meta
        run: |
          sha=$(git rev-parse --short=12 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=${GITHUB_REF_NAME#v}
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tags=-t $IMAGE:$v -t $IMAGE:${v%.*} -t $IMAGE:latest -t $IMAGE:sha-$sha" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev+$sha" >> "$GITHUB_OUTPUT"
            echo "tags=-t $IMAGE:sha-$sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        # Two platforms' Go builds do not fit beside the runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker buildx create --use --name release
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=$(git rev-parse HEAD) \
            --label org.opencontainers.image.version=${{ steps.meta.outputs.version }} \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            ${{ steps.meta.outputs.tags }} .

  # Points :main at main's current head, one at a time. Each run promotes the
  # head's image, not its own commit's, so a pending run that replaces another
  # still promotes the head; a head whose image is not published yet is left to
  # its own run.
  main-tag:
    if: github.event_name == 'workflow_run'
    needs: image
    runs-on: ubuntu-latest
    concurrency:
      group: release-main-tag
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Point :main at main's head
        run: |
          head=$(git ls-remote "${{ github.server_url }}/${{ github.repository }}" refs/heads/main | cut -c1-12)
          if ! docker buildx imagetools inspect "$IMAGE:sha-$head" >/dev/null 2>&1; then
            echo "the image of main's head $head is not published yet; its own run moves :main"; exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:sha-$head"
