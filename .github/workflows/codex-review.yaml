name: Codex PR review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only PRs opened and triggered by klinux may use the API key. Checking
    # triggering_actor also prevents another user from re-running the workflow.
    # pull_request keeps repository secrets unavailable to forks.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'klinux' &&
      github.actor == 'klinux' &&
      github.triggering_actor == 'klinux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    env:
      CODEX_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CODEX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the pull request merge result
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      # Keep Codex last in this job so no later step inherits changes to the
      # runner. The separate job below has only the generated text as input.
      - name: Review the pull request with Codex
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/pr-review.md
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-version: "0.166.0"
          effort: high
          codex-args: '["--ephemeral"]'
          allow-users: klinux

  publish:
    needs: review
    if: >-
      !cancelled() &&
      needs.review.result == 'success' &&
      needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Create or update the Codex review comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-pr-review -->';
            const suffix = '\n\n---\n_Review generated by Codex._';
            const maxBytes = 60_000;
            let review = process.env.CODEX_FINAL_MESSAGE || '';
            let body = `${marker}\n${review}${suffix}`;

            while (Buffer.byteLength(body, 'utf8') > maxBytes && review.length > 0) {
              review = review.slice(0, Math.floor(review.length * 0.9));
              body = `${marker}\n${review}\n\n_[Output truncated by the workflow.]_${suffix}`;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );
            const previous = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
