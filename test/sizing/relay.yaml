apiVersion: v1
kind: ConfigMap
metadata: {name: bench-relay, namespace: apps}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 127.0.0.1:4317}
    processors:
      batch: {send_batch_size: 512, send_batch_max_size: 512, timeout: 200ms}
    extensions:
      bearertokenauth/sdk: {scheme: Bearer, filename: /token/token}
    exporters:
      otlp_grpc:
        endpoint: fusescope-agent-otlp.platform.svc:4317
        tls: {ca_file: /ca/ca.crt, min_version: "1.3"}
        auth: {authenticator: bearertokenauth/sdk}
        sending_queue: {num_consumers: 20, queue_size: 5000}
    service:
      extensions: [bearertokenauth/sdk]
      telemetry: {metrics: {level: none}}
      pipelines:
        logs: {receivers: [otlp], processors: [batch], exporters: [otlp_grpc]}
        metrics: {receivers: [otlp], processors: [batch], exporters: [otlp_grpc]}
