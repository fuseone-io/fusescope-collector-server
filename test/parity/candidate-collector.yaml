receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
      status:
        enabled: true
        path: /health/status
      config:
        enabled: false

processors:
  # >>> managed processors: the same in reference-collector.yaml and candidate-collector.yaml
  # (parity.sh checks it). Generated by the FuseScope backend's own builders, read at
  # fuseone-io/fusescope@3ed21c8e5: logparsingpipeline.GenerateCollectorConfigWithPipelines,
  # spantypes.GenerateCollectorConfigWithSpanMapperProcessor and
  # llmpricingruletypes.GenerateCollectorConfigWithLLMPricingProcessor, applied in that order
  # (opamp spec §5), from UI-shaped inputs: five log pipelines (one disabled, so not pushed; one
  # disabled operator), the three shipped span mapper groups plus a user group and an all-off
  # one (left out), and six pricing rules (the negative one left out). The json_parser mapping
  # operators keep the random ids the backend gave them. managed_corpus.py exercises each rule.
  signozlogspipeline/pipeline_nginx-access:
    operators:
    - default: noop
      id: router_signoz
      routes:
      - expr: resource["service.name"] == "web" and body != nil && lower(body) contains lower("HTTP/")
        output: parse-access
      type: router
    - id: parse-access
      if: body != nil
      output: access-time
      parse_from: body
      parse_to: attributes
      pattern: '%{IPORHOST:client.address} - %{DATA:user.name} \[%{HTTPDATE:access_time}\] "%{WORD:http.request.method} %{DATA:url.path} HTTP/%{NUMBER:network.protocol.version}" %{NUMBER:http.response.status_code} %{NUMBER:http.response.body.size:int} "%{DATA:http.referrer}" "%{DATA:user_agent.original}"'
      type: grok_parser
    - id: access-time
      if: attributes?.access_time != nil && attributes.access_time matches "[0-9]{2}/[a-zA-Z]*?/[0-9]{4}:[0-9]{2}:[0-9]{2}:[0-9]{2} [-+][0-9]*?"
      layout: '%d/%b/%Y:%H:%M:%S %z'
      layout_type: strptime
      output: status-severity
      parse_from: attributes.access_time
      type: time_parser
    - id: status-severity
      if: attributes["http.response.status_code"] != nil && ( type(attributes["http.response.status_code"]) == "string" || ( type(attributes["http.response.status_code"]) in ["int", "float"] && attributes["http.response.status_code"] == float(int(attributes["http.response.status_code"])) ) )
      mapping:
        error:
        - 5xx
        info:
        - 2xx
        - 3xx
        warn:
        - 4xx
      output: drop-access-time
      overwrite_text: true
      parse_from: attributes["http.response.status_code"]
      type: severity_parser
    - field: attributes.access_time
      id: drop-access-time
      if: attributes?.access_time != nil
      output: tag-pipeline
      type: remove
    - field: attributes["log.pipeline"]
      id: tag-pipeline
      output: status-class
      type: add
      value: nginx
    - field: attributes["http.status_class"]
      id: status-class
      if: (attributes["http.response.status_code"] != nil)
      output: copy-method
      type: add
      value: EXPR(attributes["http.response.status_code"][0:1] + "xx")
    - from: attributes["http.request.method"]
      id: copy-method
      if: attributes["http.request.method"] != nil
      output: path-to-route
      to: attributes["http.method"]
      type: copy
    - from: attributes["url.path"]
      id: path-to-route
      if: attributes["url.path"] != nil
      to: attributes["http.route"]
      type: move
    - id: noop
      type: noop
  signozlogspipeline/pipeline_orders-json:
    operators:
    - default: noop
      id: router_signoz
      routes:
      - expr: resource["service.name"] == "orders" and resource["deployment.environment"] != nil && resource["deployment.environment"] in ['prod','staging']
        output: parse-json
      type: router
    - enable_flattening: true
      enable_paths: true
      id: parse-json
      max_flattening_depth: 1
      on_error: send_quiet
      output: e0574e6e-f7d4-4b72-9a13-a18f189003df-json-parser
      parse_from: body
      parse_to: attributes
      type: json_parser
    - from: attributes["host"]
      id: e0574e6e-f7d4-4b72-9a13-a18f189003df-json-parser
      if: attributes["host"] != nil
      on_error: send_quiet
      output: 62165612-eee8-4854-a670-d20bbedb348b-json-parser
      to: resource["host.name"]
      type: move
    - from: attributes["service"]
      id: 62165612-eee8-4854-a670-d20bbedb348b-json-parser
      if: attributes["service"] != nil
      on_error: send_quiet
      output: 7b614bcb-fa25-4dab-9a05-a3b651abf702-json-parser
      to: resource["service.name"]
      type: move
    - id: 7b614bcb-fa25-4dab-9a05-a3b651abf702-json-parser
      on_error: send_quiet
      output: d847844b-0795-46b7-848c-ff730ec1409e-json-parser
      trace_id:
        parse_from: attributes["trace_id"]
      type: trace_parser
    - id: d847844b-0795-46b7-848c-ff730ec1409e-json-parser
      on_error: send_quiet
      output: 0229ad1a-3312-4ef0-a1b1-4f3ff7b44760-json-parser
      span_id:
        parse_from: attributes["span_id"]
      type: trace_parser
    - id: 0229ad1a-3312-4ef0-a1b1-4f3ff7b44760-json-parser
      if: attributes["lvl"] != nil && ( type(attributes["lvl"]) == "string" || ( type(attributes["lvl"]) in ["int", "float"] && attributes["lvl"] == float(int(attributes["lvl"])) ) )
      mapping:
        debug:
        - DEBUG
        - Debug
        - debug
        - dbg
        - Dbg
        error:
        - ERROR
        - Error
        - error
        - err
        - Err
        - ERR
        - fail
        - Fail
        - FAIL
        fatal:
        - FATAL
        - Fatal
        - fatal
        - critical
        - Critical
        - CRITICAL
        - crit
        - Crit
        - CRIT
        - panic
        - Panic
        - PANIC
        info:
        - INFO
        - Info
        - info
        trace:
        - TRACE
        - Trace
        - trace
        - trc
        - Trc
        warn:
        - WARN
        - Warn
        - warn
        - warning
        - Warning
        - wrn
        - Wrn
      on_error: send_quiet
      output: c9ed64e3-980c-4c0e-bf57-a6d66b7dca42-json-parser
      parse_from: attributes["lvl"]
      type: severity_parser
    - id: c9ed64e3-980c-4c0e-bf57-a6d66b7dca42-json-parser
      if: attributes["level"] != nil && ( type(attributes["level"]) == "string" || ( type(attributes["level"]) in ["int", "float"] && attributes["level"] == float(int(attributes["level"])) ) )
      mapping:
        debug:
        - DEBUG
        - Debug
        - debug
        - dbg
        - Dbg
        error:
        - ERROR
        - Error
        - error
        - err
        - Err
        - ERR
        - fail
        - Fail
        - FAIL
        fatal:
        - FATAL
        - Fatal
        - fatal
        - critical
        - Critical
        - CRITICAL
        - crit
        - Crit
        - CRIT
        - panic
        - Panic
        - PANIC
        info:
        - INFO
        - Info
        - info
        trace:
        - TRACE
        - Trace
        - trace
        - trc
        - Trc
        warn:
        - WARN
        - Warn
        - warn
        - warning
        - Warning
        - wrn
        - Wrn
      on_error: send_quiet
      output: a0b45d5d-2dbb-4afd-ae5f-c18b1d483353-json-parser
      parse_from: attributes["level"]
      type: severity_parser
    - from: attributes["env"]
      id: a0b45d5d-2dbb-4afd-ae5f-c18b1d483353-json-parser
      if: attributes["env"] != nil
      on_error: send_quiet
      output: dc9303d3-92b2-4e73-aba5-174dc826a44b-json-parser
      to: resource["deployment.environment.name"]
      type: move
    - from: attributes["message"]
      id: dc9303d3-92b2-4e73-aba5-174dc826a44b-json-parser
      if: attributes["message"] != nil
      on_error: send_quiet
      output: 760d803f-3c1d-4046-8ecc-b7cecea3dcb5-json-parser
      to: body
      type: move
    - from: attributes["msg"]
      id: 760d803f-3c1d-4046-8ecc-b7cecea3dcb5-json-parser
      if: attributes["msg"] != nil
      on_error: send_quiet
      output: currency
      to: body
      type: move
    - field: attributes.currency
      id: currency
      output: parse-order
      type: add
      value: $$USD
    - id: parse-order
      if: body != nil && body matches "^order (?P<order_id>\\d+) (?P<order_status>[a-z]+)$$"
      output: order-time
      parse_from: body
      parse_to: attributes
      regex: ^order (?P<order_id>\d+) (?P<order_status>[a-z]+)$$
      type: regex_parser
    - id: order-time
      if: attributes?.ts_ms != nil && string(attributes.ts_ms) matches "^\\s*[0-9]+\\s*$$"
      layout: ms
      layout_type: epoch
      output: drop-ts
      parse_from: attributes.ts_ms
      type: time_parser
    - field: attributes.ts_ms
      id: drop-ts
      if: attributes?.ts_ms != nil
      type: remove
    - id: noop
      type: noop
  signozlogspipeline/pipeline_payments-legacy-:
    operators:
    - default: noop
      id: router_signoz
      routes:
      - expr: attributes["log.type"] == "legacy"
        output: parse-legacy
      type: router
    - id: parse-legacy
      if: body != nil && body matches "^(?P<ts>\\d+\\.\\d+) (?P<level>[A-Z]+) \\[(?P<thread>[^\\]]+)\\] trace=(?P<trace>[0-9a-f]{32}) span=(?P<span>[0-9a-f]{16}) (?P<msg>.*)$$"
      output: legacy-time
      parse_from: body
      parse_to: attributes
      regex: ^(?P<ts>\d+\.\d+) (?P<level>[A-Z]+) \[(?P<thread>[^\]]+)\] trace=(?P<trace>[0-9a-f]{32}) span=(?P<span>[0-9a-f]{16}) (?P<msg>.*)$$
      type: regex_parser
    - id: legacy-time
      if: attributes?.ts != nil && string(attributes.ts) matches "^\\s*[0-9]+\\.[0-9]+\\s*$$"
      layout: s.ms
      layout_type: epoch
      output: legacy-severity
      parse_from: attributes.ts
      type: time_parser
    - id: legacy-severity
      if: attributes?.level != nil && ( type(attributes.level) == "string" || ( type(attributes.level) in ["int", "float"] && attributes.level == float(int(attributes.level)) ) )
      mapping:
        fatal:
        - CRIT
        warn:
        - WARNING
      output: legacy-trace
      overwrite_text: true
      parse_from: attributes.level
      type: severity_parser
    - id: legacy-trace
      output: legacy-body
      span_id:
        parse_from: attributes.span
      trace_id:
        parse_from: attributes.trace
      type: trace_parser
    - from: attributes.msg
      id: legacy-body
      if: attributes?.msg != nil
      output: legacy-drop-trace
      to: body
      type: move
    - field: attributes.trace
      id: legacy-drop-trace
      if: attributes?.trace != nil
      output: legacy-origin
      type: remove
    - from: resource["service.name"]
      id: legacy-origin
      if: resource["service.name"] != nil
      to: attributes["origin.service"]
      type: copy
    - id: noop
      type: noop
  signozlogspipeline/pipeline_audit:
    operators:
    - default: noop
      id: router_signoz
      routes:
      - expr: '"audit" in attributes and (((type(body) == "string" && isJSON(body)) && "user" in fromJSON(body)) or (type(body) == "map" && (body.user != nil)))'
        output: audit-user
      type: router
    - from: body.user
      id: audit-user
      if: body?.user != nil
      output: audit-flag
      to: attributes["enduser.id"]
      type: copy
    - field: attributes["audit.checked"]
      id: audit-flag
      if: (attributes?.audit != nil)
      type: add
      value: EXPR(lower(attributes.audit) == "yes")
    - id: noop
      type: noop
  signozspanmapper:
    groups:
    - attributes:
      - context: attribute
        sources:
        - key: crewai.agent.role
        - key: agent.name
        - key: agent_name
        target: gen_ai.agent.name
      - context: attribute
        sources:
        - key: agent_id
        - key: crewai.agent.id
        - key: agent.id
        target: gen_ai.agent.id
      - context: attribute
        sources:
        - key: agent.description
        target: gen_ai.agent.description
      - context: attribute
        sources:
        - action: move
          key: final_result
        target: gen_ai.output.messages
      - context: attribute
        sources:
        - key: openinference.span.kind
        - key: llm.request.type
        - key: traceloop.span.kind
        target: gen_ai.operation.name
      - context: resource
        sources:
        - key: resource.deployment.environment
        target: deployment.environment.name
      exists_any:
        attributes:
        - agent
      id: gen_ai.agent
    - attributes:
      - context: attribute
        sources:
        - key: reranker.model_name
        - key: llm.model_name
        - key: llm.request.model
        - key: ai.model.id
        - key: langfuse.observation.model.name
        - key: embedding.model_name
        - key: model
        - key: gen_ai.response.model
        target: gen_ai.request.model
      - context: attribute
        sources:
        - key: llm.response.model
        - key: ai.response.model
        target: gen_ai.response.model
      - context: attribute
        sources:
        - key: gen_ai.system
        - key: llm.vendor
        - key: llm.provider
        - key: llm.system
        - key: ai.model.provider
        target: gen_ai.provider.name
      - context: attribute
        sources:
        - key: openinference.span.kind
        - key: llm.request.type
        - key: traceloop.span.kind
        target: gen_ai.operation.name
      - context: attribute
        sources:
        - key: input_tokens
        - key: gen_ai.usage.prompt_tokens
        - key: llm.usage.prompt_tokens
        - key: llm.token_count.prompt
        - key: ai.usage.inputTokens
        - key: ai.usage.promptTokens
        target: gen_ai.usage.input_tokens
      - context: attribute
        sources:
        - key: output_tokens
        - key: gen_ai.usage.completion_tokens
        - key: llm.usage.completion_tokens
        - key: llm.token_count.completion
        - key: ai.usage.outputTokens
        - key: ai.usage.completionTokens
        target: gen_ai.usage.output_tokens
      - context: attribute
        sources:
        - key: cache_read_tokens
        - key: gen_ai.usage.input_tokens.cached
        - key: gen_ai.usage.prompt_token_details.cached_read_tokens
        - key: gen_ai.usage.cache_read_input_tokens
        - key: llm.token_count.prompt_details.cache_read
        - key: ai.usage.cachedInputTokens
        target: gen_ai.usage.cache_read.input_tokens
      - context: attribute
        sources:
        - key: cache_creation_tokens
        - key: gen_ai.usage.cache_write.input_tokens
        - key: gen_ai.usage.cache_creation_input_tokens
        - key: llm.token_count.prompt_details.cache_write
        target: gen_ai.usage.cache_creation.input_tokens
      - context: attribute
        sources:
        - key: gen_ai.usage.reasoning_tokens
        - key: gen_ai.usage.completion_token_details.reasoning_tokens
        - key: llm.token_count.completion_details.reasoning
        - key: ai.usage.reasoningTokens
        target: gen_ai.usage.reasoning.output_tokens
      - context: attribute
        sources:
        - action: move
          key: gen_ai.prompt
        - action: move
          key: ai.prompt.messages
        - action: move
          key: input.value
        target: gen_ai.input.messages
      - context: attribute
        sources:
        - action: move
          key: gen_ai.completion
        - action: move
          key: ai.response.toolCalls
        - action: move
          key: ai.response.text
        - action: move
          key: output.value
        target: gen_ai.output.messages
      - context: attribute
        sources:
        - key: gen_ai.client.session_id
        - key: session.id
        - key: langfuse.session.id
        target: gen_ai.conversation.id
      - context: attribute
        sources:
        - key: llm.finish_reason
        - key: llm.response.stop_reason
        - key: llm.response.finish_reason
        - key: gen_ai.response.finish_reason
        - key: ai.response.finishReason
        target: gen_ai.response.finish_reasons
      - context: attribute
        sources:
        - key: gen_ai.response.time_to_first_chunk
        - key: gen_ai.server.time_to_first_token
        target: gen_ai.server.ttft
      - context: resource
        sources:
        - key: resource.deployment.environment
        target: deployment.environment.name
      exists_any:
        attributes:
        - model
        - llm.input_messages
      id: gen_ai.llm
    - attributes:
      - context: attribute
        sources:
        - key: gen_ai.client.tool_name
        - key: tool_name
        - key: tool.name
        - key: ai.toolCall.name
        target: gen_ai.tool.name
      - context: attribute
        sources:
        - key: gen_ai.client.tool_use_id
        - key: tool.id
        - key: ai.toolCall.id
        target: gen_ai.tool.call.id
      - context: attribute
        sources:
        - key: tool.description
        target: gen_ai.tool.description
      - context: attribute
        sources:
        - key: ai.toolCall.args
        - key: traceloop.entity.input
        - key: gcp.vertex.agent.tool_call_args
        - key: input.value
        target: gen_ai.tool.call.arguments
      - context: attribute
        sources:
        - key: ai.toolCall.result
        - key: traceloop.entity.output
        - key: gcp.vertex.agent.tool_response
        - key: output.value
        target: gen_ai.tool.call.result
      - context: attribute
        sources:
        - key: openinference.span.kind
        - key: llm.request.type
        - key: traceloop.span.kind
        target: gen_ai.operation.name
      - context: resource
        sources:
        - key: resource.deployment.environment
        target: deployment.environment.name
      exists_any:
        attributes:
        - tool.name
        - ai.toolCall.
        - tool_call_args
        - tool_response
        - tool_use_id
      id: gen_ai.tool
    - attributes:
      - context: attribute
        sources:
        - action: move
          key: billing.tenant
        - key: resource.tenant
        target: tenant.id
      - context: resource
        sources:
        - action: move
          key: billing.cost_center
        target: billing.cost_center
      exists_any:
        attributes:
        - billing.
        resource:
        - tenant
      id: billing
  signozllmpricing:
    attrs:
      model: gen_ai.request.model
      in: gen_ai.usage.input_tokens
      out: gen_ai.usage.output_tokens
      cache_read: gen_ai.usage.cache_read.input_tokens
      cache_write: gen_ai.usage.cache_creation.input_tokens
    default_pricing:
      rules:
      - name: gpt-4o-mini
        pattern:
        - gpt-4o-mini*
        cache:
          mode: subtract
          read: 0.075
          write: 0
        in: 0.15
        out: 0.6
      - name: gpt-4o
        pattern:
        - gpt-4o*
        cache:
          mode: subtract
          read: 1.25
          write: 0
        in: 2.5
        out: 10
      - name: claude-sonnet-4
        pattern:
        - claude-sonnet-4*
        - claude-4-sonnet*
        cache:
          mode: additive
          read: 0.3
          write: 3.75
        in: 3
        out: 15
      - name: gemini-2.5-flash
        pattern:
        - gemini-2.5-flash*
        in: 0.3
        out: 2.5
      - name: mistral-large
        pattern:
        - mistral-large-?.?
        - mistral-large-latest
        cache:
          read: 0.2
          write: 0
        in: 2
        out: 6
    output_attrs:
      in: signoz.gen_ai.usage.input_tokens.cost
      out: signoz.gen_ai.usage.output_tokens.cost
      cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
      cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
      total: signoz.gen_ai.usage.tokens.cost
  # <<< managed processors

connectors:
  fusescope_spanmetrics:

exporters:
  fusescope_clickhouse:
    endpoint: clickhouse:9000
    tls:
      insecure: true
    sending_queue:
      batch:
        flush_timeout: 1s

service:
  extensions: [healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      # opamp spec §8; batching is the exporter's.
      processors: [signozspanmapper, signozllmpricing]
      exporters: [fusescope_clickhouse, fusescope_spanmetrics]
    logs:
      receivers: [otlp]
      # As the backend writes it into a logs pipeline without processors (opamp spec §5).
      processors:
        - signozlogspipeline/pipeline_nginx-access
        - signozlogspipeline/pipeline_orders-json
        - signozlogspipeline/pipeline_payments-legacy-
        - signozlogspipeline/pipeline_audit
      exporters: [fusescope_clickhouse]
    metrics:
      receivers: [otlp, fusescope_spanmetrics]
      exporters: [fusescope_clickhouse]
