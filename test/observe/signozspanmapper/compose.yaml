name: observe-spanmapper

# OBSERVE_DIR holds collector.yaml, startup/ and out/, written by cases.py.
x-reference: &reference
  image: ghcr.io/fuseone-io/fusescope-otel-collector:${REFERENCE_VERSION:-0.145.0}
  entrypoint: [/fusescope-otel-collector]

services:
  reference-collector:
    <<: *reference
    command: [--config=/etc/observe/collector.yaml]
    volumes:
      - ${OBSERVE_DIR}/collector.yaml:/etc/observe/collector.yaml:ro
      - ${OBSERVE_DIR}/out:/out
    ports:
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:14133:13133"

  startup:
    <<: *reference
    command: [--config=/etc/observe/startup.yaml]
    volumes:
      - ${OBSERVE_DIR}/startup/${STARTUP_CASE:-valid}.yaml:/etc/observe/startup.yaml:ro
      - ${OBSERVE_DIR}/out:/out
