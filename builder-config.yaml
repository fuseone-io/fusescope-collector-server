# FuseScope Collector distribution, built with the OpenTelemetry Collector
# Builder (ocb). Upstream components are Go module dependencies at pinned
# versions; upgrading upstream means bumping the versions in this file
# together (see docs/upgrading.md). FuseScope components live in components/
# and are added below with `path:` once they exist.
dist:
  module: github.com/fuseone-io/fusescope-collector-server
  name: fusescope-collector
  description: FuseScope distribution of the OpenTelemetry Collector
  version: 0.1.0-dev
  output_path: ./_build

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/otelarrowreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sclusterreceiver v0.164.1
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/receiver/rumreceiver v0.0.0
    path: ./components/receiver/rumreceiver

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v1.3.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/tailsamplingprocessor v0.164.1
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/processor/signozspanmapperprocessor v0.0.0
    path: ./components/processor/signozspanmapperprocessor
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/processor/signozllmpricingprocessor v0.0.0
    path: ./components/processor/signozllmpricingprocessor
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/processor/signozlogspipelineprocessor v0.0.0
    path: ./components/processor/signozlogspipelineprocessor

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.164.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/otelarrowexporter v0.164.1
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/exporter/fusescopeclickhouseexporter v0.0.0
    path: ./components/exporter/fusescopeclickhouseexporter

connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.164.1
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/connector/fusescopespanmetricsconnector v0.0.0
    path: ./components/connector/fusescopespanmetricsconnector

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.164.0
  - gomod: go.opentelemetry.io/collector/extension/memorylimiterextension v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckv2extension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.164.1
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/extension/fusescopeopampextension v0.0.0
    path: ./components/extension/fusescopeopampextension

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.70.0
  # Remote configuration over OpAMP (ADR 0008); same module as the fusescope_opamp extension.
  - gomod: github.com/fuseone-io/fusescope-collector-server/components/extension/fusescopeopampextension v0.0.0
    import: github.com/fuseone-io/fusescope-collector-server/components/extension/fusescopeopampextension/provider
    path: ./components/extension/fusescopeopampextension

# Security fixes ahead of upstream. Remove each line once upstream requires the
# fixed version itself; `make vuln` lists what is still needed.
replaces:
  - golang.org/x/net => golang.org/x/net v0.62.0
  # The ingest policy store shared by rumreceiver and ingestauth (ADR 0006);
  # relative to output_path.
  - github.com/fuseone-io/fusescope-collector-server/components/pkg/ingestpolicy => ../components/pkg/ingestpolicy
