# Fan-out in front of the demo collector: every request goes to the demo
# collector as before and, through a queue, to the shadow collector.
#
# The demo comes first. A request fails for its sender if any destination
# refuses it, so the shadow path must never refuse: its queue is bounded in
# bytes and shadow requests are dropped after 10 minutes of failed retries,
# which keeps the queue from ever filling. A shadow outage then shows up as
# differences in compare.py, never on the demo. The memory limiter keeps the
# tee within its container limit.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 300
    spike_limit_mib: 60

exporters:
  otlp/demo:
    endpoint: otel-collector:4317
    tls:
      insecure: true
  otlp/shadow:
    endpoint: fusescope-collector-shadow:4317
    tls:
      insecure: true
    sending_queue:
      sizer: bytes
      queue_size: 33554432 # 32 MiB per signal; the demo sends a few MiB an hour
    retry_on_failure:
      max_elapsed_time: 10m

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/demo, otlp/shadow]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/demo, otlp/shadow]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/demo, otlp/shadow]
