# Override for the FuseScope demo (fuseone-io/fusescope deploy/demo): runs the
# FuseScope collector in shadow. The demo collector sends it a copy of what it
# receives through an exporter added to its own configuration (README.md);
# nothing else in the demo changes. Copy this directory to <demo>/shadow and use
#   docker compose -f compose.yaml -f shadow/compose.shadow.yaml ...
# Paths are relative to the demo directory.

x-shadow-logging: &shadow-logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # Headroom for the copy it sends to the shadow: the demo collector ran close
  # to its 384 MiB limit on its own (README.md, Risks).
  otel-collector:
    mem_limit: 768m
    cpus: 0.5

  clickhouse-shadow:
    <<: *shadow-logging
    image: clickhouse/clickhouse-server:25.12.5
    hostname: clickhouse-shadow
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./shadow/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./shadow/clickhouse/limits.xml:/etc/clickhouse-server/config.d/zz-limits.xml:ro
      - ./shadow/clickhouse/users-limits.xml:/etc/clickhouse-server/users.d/zz-limits.xml:ro
      - clickhouse-shadow-data:/var/lib/clickhouse/
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [shadow]
    restart: unless-stopped
    mem_limit: 4096m
    cpus: 0.75

  # The reference image's migrator, run as a black box (ADR 0002), creates
  # the schema the shadow collector writes into.
  migrator-shadow:
    <<: *shadow-logging
    image: ghcr.io/fuseone-io/fusescope-otel-collector:${COLLECTOR_VERSION:-0.145.0}
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse-shadow:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint: [/bin/sh, -c]
    command:
      - /fusescope-otel-collector migrate bootstrap && /fusescope-otel-collector migrate sync up && /fusescope-otel-collector migrate async up
    networks: [shadow]
    depends_on:
      clickhouse-shadow:
        condition: service_healthy
    restart: on-failure:5
    mem_limit: 256m
    cpus: 0.25

  fusescope-collector-shadow:
    <<: *shadow-logging
    image: ${SHADOW_COLLECTOR_IMAGE:-fusescope-collector:shadow}
    command: [--config=/etc/fusescope-collector/config.yaml]
    # Host UTS namespace and root, as the demo collector, for host metrics.
    uts: host
    volumes:
      - ./shadow/collector.yaml:/etc/fusescope-collector/config.yaml:ro
      - /:/hostfs:ro
    # On the demo network only to receive from otel-collector; it writes only
    # to clickhouse-shadow, which is not on that network.
    networks: [default, shadow]
    depends_on:
      migrator-shadow:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.3

  # The demo's backend, same version, reading clickhouse-shadow instead: the
  # APM pages over the shadow's data, for compare_ui.py. On demand, profile ui.
  fusescope-shadow-ui:
    <<: *shadow-logging
    image: ghcr.io/fuseone-io/fusescope:${FUSESCOPE_VERSION:?set FUSESCOPE_VERSION in .env}
    environment:
      SIGNOZ_WEB_ENABLED: "false"
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/fusescope/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SHADOW_UI_JWT_SECRET:?set SHADOW_UI_JWT_SECRET}
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse-shadow:9000
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER: cluster
    volumes:
      - fusescope-shadow-ui-data:/var/lib/fusescope/
    networks: [shadow]
    depends_on:
      clickhouse-shadow:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    profiles: [ui]

  # On demand: docker compose --profile ui ... run --rm shadow-compare-ui
  shadow-compare-ui:
    image: python:3.12-alpine
    command: [python3, -I, /compare_ui.py]
    volumes:
      - ./shadow/compare_ui.py:/compare_ui.py:ro
    environment:
      DEMO_EMAIL: ${DEMO_EMAIL:?set DEMO_EMAIL in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?pass the demo viewer password}
      SHADOW_UI_EMAIL: shadow@fusescope.local
      SHADOW_UI_PASSWORD: ${SHADOW_UI_PASSWORD:?set SHADOW_UI_PASSWORD}
    networks: [default, shadow]
    depends_on: [fusescope-shadow-ui]
    profiles: [ui]

  # On demand: docker compose ... run --rm shadow-compare
  shadow-compare:
    image: python:3.12-alpine
    command: [python3, -I, /compare.py]
    volumes:
      - ./shadow/compare.py:/compare.py:ro
    environment:
      DEMO_CLICKHOUSE: http://clickhouse:8123
      SHADOW_CLICKHOUSE: http://clickhouse-shadow:8123
    networks: [default, shadow]
    profiles: [compare]

networks:
  shadow:
    name: fusescope-shadow

volumes:
  clickhouse-shadow-data:
  fusescope-shadow-ui-data:
