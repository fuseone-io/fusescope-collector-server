# Override for the FuseScope demo, after compose.shadow.yaml (README, "Swap").
# The demo kit's collector, fusescope-collector, writes the demo's ClickHouse
# and sends a copy of what it accepts to the existing collector, now the ghost
# writing clickhouse-shadow. The ghost is moved by its network, not by its
# configuration, which is not read (ADR 0002): it sees only the shadow
# network, where `clickhouse` is clickhouse-shadow. Use
#   docker compose -f compose.yaml -f shadow/compose.shadow.yaml -f shadow/compose.swap.yaml ...
# Paths are relative to the demo directory.

x-swap-logging: &swap-logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # The demo's collector, with the copy to the ghost merged over its
  # configuration. It reaches the demo's ClickHouse by its container name,
  # which only the default network has.
  fusescope-collector:
    command:
      - --config=fusescopeopamp:/etc/fusescope-collector/config.yaml
      - --config=file:/etc/fusescope-collector/ghost-copy.yaml
    volumes:
      - ./shadow/ghost-copy.yaml:/etc/fusescope-collector/ghost-copy.yaml:ro
    networks: [default, shadow]

  # The shadow collector's place is taken by fusescope-collector.
  fusescope-collector-shadow:
    profiles: [unswapped]

  # On the shadow network, `clickhouse` is clickhouse-shadow. Only this
  # container is recreated for it; the demo's ClickHouse is not.
  clickhouse-shadow:
    networks:
      shadow:
        aliases: [clickhouse]

  # The ghost, on the shadow network only: whatever its configuration names
  # `clickhouse` is clickhouse-shadow there. Its environment's DSN alone does
  # not move its exporters (the attempt of 2026-11-04).
  otel-collector:
    <<: *swap-logging
    image: ghcr.io/fuseone-io/fusescope-otel-collector:${COLLECTOR_VERSION:-0.145.0}
    entrypoint: [/bin/sh]
    command:
      - -c
      - |
        /fusescope-otel-collector migrate sync check &&
        /fusescope-otel-collector --config=/etc/otel-collector-config.yaml
    uts: host
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    networks: [shadow]
    depends_on:
      migrator-shadow:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5

  shadow-compare:
    environment:
      DEMO_CLICKHOUSE: http://fusescope-demo-clickhouse-1:8123
      DEMO_LABEL: fusescope
      SHADOW_LABEL: fork
      OURS: demo
