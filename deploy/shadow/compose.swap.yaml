# Override for the FuseScope demo, after compose.shadow.yaml: swaps the roles
# (README, "Swap"). The senders point at this collector, which writes the
# demo's ClickHouse and sends a copy to the existing collector, now the ghost
# writing clickhouse-shadow. The ghost is moved by its network, not by its
# configuration, which is not read (ADR 0002): it sees only the shadow
# network, where `clickhouse` is clickhouse-shadow. Use
#   docker compose -f compose.yaml -f shadow/compose.shadow.yaml -f shadow/compose.swap.yaml ...
# Paths are relative to the demo directory.

x-swap-logging: &swap-logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # The demo's collector.
  fusescope-collector:
    <<: *swap-logging
    image: ${SHADOW_COLLECTOR_IMAGE:-fusescope-collector:shadow}
    command: [--config=/etc/fusescope-collector/config.yaml]
    # Host UTS namespace and root, as the existing collector, for host metrics.
    uts: host
    volumes:
      - ./shadow/primary.yaml:/etc/fusescope-collector/config.yaml:ro
      - /:/hostfs:ro
    # The demo's ClickHouse by its container name, which only the default
    # network has; the ghost as otel-collector, on shadow only.
    networks: [default, shadow]
    depends_on:
      telemetrystore-migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5

  # The shadow collector's place is taken by fusescope-collector.
  fusescope-collector-shadow:
    profiles: [unswapped]

  # On the shadow network, `clickhouse` is clickhouse-shadow. Only this
  # container is recreated for it; the demo's ClickHouse is not.
  clickhouse-shadow:
    networks:
      shadow:
        aliases: [clickhouse]

  # The ghost, on the shadow network only: whatever its configuration names
  # `clickhouse` is clickhouse-shadow there. Its environment's DSN alone does
  # not move its exporters (the attempt of 2026-11-04).
  otel-collector:
    networks: !override [shadow]

  hotrod:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fusescope-collector:4318

  logs-checkout:
    command:
      - logs
      - --otlp-endpoint=fusescope-collector:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=0.5
      - --service=checkout
      - --otlp-attributes=deployment.environment="demo"
      - --body=order placed
      - --severity-text=Info
      - --severity-number=9

  logs-payment-error:
    command:
      - logs
      - --otlp-endpoint=fusescope-collector:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=0.1
      - --service=payment
      - --otlp-attributes=deployment.environment="demo"
      - --body=card declined - insufficient funds
      - --severity-text=Error
      - --severity-number=17

  traces-payment-errors:
    command:
      - traces
      - --otlp-endpoint=fusescope-collector:4317
      - --otlp-insecure
      - --duration=inf
      - --rate=0.1
      - --service=payment
      - --otlp-attributes=deployment.environment="demo"
      - --child-spans=2
      - --span-duration=250ms
      - --status-code=Error

  # RUM still goes through the backend's gateway until the release that moves
  # it into this collector.
  fusescope:
    environment:
      SIGNOZ_RUM_COLLECTOR__ENDPOINT: http://fusescope-collector:4318

  shadow-compare:
    environment:
      DEMO_CLICKHOUSE: http://fusescope-demo-clickhouse-1:8123
      DEMO_LABEL: fusescope
      SHADOW_LABEL: fork
      OURS: demo
