# The FuseScope collector in shadow on the demo host. What it does mirrors
# what the demo's ClickHouse shows the demo collector writing (README,
# "Derived from the demo's data"); it writes only to clickhouse-shadow.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Accepts the demo collector's exporter keepalive (10 s, also when idle,
        # demo-collector-shadow.yaml) instead of closing it with too_many_pings.
        keepalive:
          enforcement_policy:
            min_time: 5s
            permit_without_stream: true
      http:
        endpoint: 0.0.0.0:4318
  host_metrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      # Per logical CPU, and no logical count: the demo writes system.cpu.time
      # with a cpu label and no system.cpu.logical.count.
      cpu:
        metrics:
          system.cpu.time:
            attributes: [cpu, state]
          system.cpu.logical.count:
            enabled: false
      load: {}
      # The demo writes no series for the optical drive.
      disk:
        exclude:
          devices: [sr0]
          match_type: strict
      filesystem: {}
      memory: {}

processors:
  resourcedetection/system:
    detectors: [system]
    system:
      hostname_sources: [os]

connectors:
  fusescope_spanmetrics:

exporters:
  fusescope_clickhouse:
    endpoint: clickhouse-shadow:9000
    tls:
      insecure: true
    # The exporter's default since it was found here (docs/spec/clickhouse-traces.md §1, Insert batches).
        flush_timeout: 10s

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
      status:
        enabled: true
        path: /health/status
      config:
        enabled: false

service:
  extensions: [healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [fusescope_clickhouse, fusescope_spanmetrics]
    logs:
      receivers: [otlp]
      exporters: [fusescope_clickhouse]
    metrics:
      receivers: [otlp, fusescope_spanmetrics]
      exporters: [fusescope_clickhouse]
    metrics/host:
      receivers: [host_metrics]
      processors: [resourcedetection/system]
      exporters: [fusescope_clickhouse]
