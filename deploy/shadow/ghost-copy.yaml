# Merged over the demo kit's collector/config.yaml (compose.swap.yaml): a copy
# of what its OTLP and RUM receivers accept goes to the ghost, which writes
# clickhouse-shadow. The ghost's pipelines never refuse, so a ghost problem
# never fails a demo request.
processors:
  # The copy is accepted here and exported on its own: a full or failing ghost
  # queue drops copies.
  batch/ghost: {}

exporters:
  # Plaintext inside the demo's network; demo only, never shipped.
  otlp/ghost:
    endpoint: dns:///otel-collector:4317
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 33554432   # 32 MiB per signal
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s

service:
  pipelines:
    traces/ghost:
      receivers: [otlp, rum]
      processors: [batch/ghost]
      exporters: [otlp/ghost]
    logs/ghost:
      receivers: [otlp, rum]
      processors: [batch/ghost]
      exporters: [otlp/ghost]
    metrics/ghost:
      receivers: [otlp]
      processors: [batch/ghost]
      exporters: [otlp/ghost]
