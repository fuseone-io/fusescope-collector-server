# Merged over the demo kit's collector/config.yaml with one or more of
# traces.yaml, logs.yaml and metrics.yaml (CUTOVER.md, "Roll back a signal"):
# the exporter to the earlier collector, run as the legacy writer on the demo's
# network (compose.legacy.yaml), which writes the demo's ClickHouse.
exporters:
  # Plaintext inside the demo's network; demo only, never shipped.
  otlp/legacy:
    endpoint: dns:///otel-collector-legacy:4317
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 33554432   # 32 MiB per signal
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
