# Merged into the demo collector's configuration to feed the shadow (README.md, Install).
exporters:
  otlp/shadow:
    endpoint: dns:///fusescope-collector-shadow:4317
    tls:
      insecure: true
    timeout: 5s
    keepalive:
      time: 10s
      timeout: 5s
      permit_without_stream: true
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 33554432   # 32 MiB per signal, held in the demo collector's memory
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s

# The memory limiter refuses with the same thresholds as the demo pipelines'
# (raised in README, Install), so a request refused there is refused here too
# and a sender's retry does not reach the shadow twice. The batch processor
# accepts the copy and exports it on its own, so a full or failing shadow queue
# drops shadow copies and never fails a demo request.
processors:
  memory_limiter/shadow:
    check_interval: 2s
    limit_mib: 640
    spike_limit_mib: 128
  batch/shadow: {}

service:
  pipelines:
    traces/shadow:
      receivers: [otlp]
      processors: [memory_limiter/shadow, batch/shadow]
      exporters: [otlp/shadow]
    logs/shadow:
      receivers: [otlp]
      processors: [memory_limiter/shadow, batch/shadow]
      exporters: [otlp/shadow]
    metrics/shadow:
      receivers: [otlp]
      processors: [memory_limiter/shadow, batch/shadow]
      exporters: [otlp/shadow]
